services:
  # Câu 81: Khai báo Service backend
  backend:
    build: ./server
    container_name: mern-backend
    # Câu 83: Cấu hình Port cho Backend (5000:5000)
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường MONGODB_URI cho Backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://dung0856028347_db_user:xWk1WpYWZiZIVFNc@tmd0910.mey6m6i.mongodb.net/cloud_lab?appName=TMD0910
    volumes:
      - ./server:/app
      - /app/node_modules

  # Câu 82: Khai báo Service frontend
  frontend:
    build: ./client
    container_name: mern-frontend
    # Câu 84: Cấu hình Port cho Frontend (3000:3000)
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend